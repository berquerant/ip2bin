on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  test:
    timeout-minutes: 5
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: "false"
      - name: Set up Ruby
        uses: ruby/setup-ruby@0481980f17b760ef6bca5e8c55809102a0af1e5a
        with:
          bundler-cache: true
      - name: Install dependencies
        run: bundle install
      - name: Fmt check
        run: bundle exec rake check:rufo
      - name: Rbs check
        run: bundle exec rake check:rbs
      - name: Steep
        run: bundle exec rake check:steep
      - name: Run tests
        run: bundle exec rake spec
